[VMCatchUp]
; Experimental. Extra stock VM cycles inside the game's own "VM update" job when frames
; are slower than TargetFPS. See the README before enabling.
;   off        - default, nothing is installed
;   carried    - only runs calls the stock update of the same frame left waiting in the queue
;   accelerate - experimental: also runs a script's next call in the same frame while every
;                native it ran this frame was a read or a side-effect-free helper; faster, but
;                skips the game update between those calls, which some scripts may rely on
Mode=off
; 30-144. Extra cycles start only while the average frame rate (about the last half
; second) is below this. Above it the game runs exactly as without the plugin.
EngageBelowFPS=50
; 30-144. While engaged, the VM cycle rate extra cycles restore. EngageBelowFPS above
; this value is lowered to it.
TargetFPS=60
; 1-8. Extra cycles allowed in one frame (4 reaches 60 Hz down to 12 FPS).
MaxExtraCycles=4
; 0.25-8. Stops starting new extra cycles after this many milliseconds in a frame.
MaxExtraMS=2.0
; Experimental, Mode=accelerate only. false: an extra cycle stops at the first queued call
; that has to wait for the next frame, so no call runs ahead of one queued before it.
; true: it passes such calls and runs the ones behind them. Much larger effect, but a call
; can then run before an earlier queued call of another script, which the stock game
; never does. The calls that had to wait keep their order. See the README before enabling.
SkipWaitingCalls=false

[General]
; Legacy, off by default: raises the budget of the "VM render-safe" task queue below
; 50 FPS. It showed no measurable effect on script delays; see the README.
Enabled=false

; Optional two-minute ABBA run of the legacy correction with a Papyrus latency probe.
; Needs Enabled=true above.
; Load a save, keep the camera stationary, and wait for "benchmark complete"
; in the PapyrusCatchUp log. Leave disabled for regular play.
Benchmark=false

[NativePacing]
; Opt-in on Skyrim AE 1.6.1170. Promotes stock Form.GetFormID calls below 50 FPS.
; At most 96 new calls per gameplay VM update. Excess uses the original queue.
Enabled=false
